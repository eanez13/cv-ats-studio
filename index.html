<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV ATS Studio</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2330; --muted:#667085; --line:#e3e6eb;
  --brand:#1f5eff; --brand-soft:#e8efff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --accent:#1f4e79;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
@media (min-width:821px){.app{overflow:hidden}.main{min-height:0;overflow:hidden}}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header.top h1{font-size:16px;margin:0 8px 0 0;letter-spacing:.2px}
header.top h1 span{color:var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c7ccd4}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
select,input[type=text],input[type=email],input[type=tel],input[type=url],textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;width:100%}
textarea{resize:vertical;min-height:60px;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.main{display:grid;grid-template-columns:minmax(360px,460px) 1fr minmax(280px,330px);min-height:0}
.pane{overflow:auto;min-height:0}
.editor{background:var(--panel);border-right:1px solid var(--line);padding:12px 14px 40px}
.preview-wrap{padding:20px;display:flex;justify-content:center;align-items:flex-start}
.side{background:var(--panel);border-left:1px solid var(--line);padding:14px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:10px;border-bottom:1px solid var(--line)}
.tab{padding:8px 5px;font-size:12.5px;border:none;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
details.sec{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:#fff}
details.sec>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{transition:transform .15s;color:var(--muted)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
details.sec>summary .grow{flex:1}
.sec-body{padding:0 12px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.field>span{font-size:12px;color:var(--muted)}
.item{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#fcfcfd}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 8px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tpl{border:2px solid var(--line);border-radius:10px;padding:8px;cursor:pointer;background:#fff;text-align:left}
.tpl.active{border-color:var(--brand);background:var(--brand-soft)}
.tpl b{display:block;font-size:13px}
.tpl small{color:var(--muted);font-size:11px}
.tpl .mini{height:56px;border-radius:6px;background:#fff;border:1px solid var(--line);margin-bottom:6px;padding:6px;overflow:hidden}
.mini i{display:block;height:4px;border-radius:2px;background:#cfd5de;margin:3px 0}
.score{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.ring{--p:0;--c:var(--ok);width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#eceff3 0);display:grid;place-items:center}
.ring div{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f5;font-size:13px;line-height:1.35}
.checks li .d{flex:0 0 18px;font-weight:700}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.side h3{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line)}
.chip.hit{background:#e9f8ee;border-color:#bfe7cc;color:#11602f}
.chip.miss{background:#fff3e8;border-color:#fbd4ad;color:#8a4b06;cursor:pointer}
.order-list{list-style:none;padding:0;margin:0}
.order-list li{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:#fff}
.order-list li span{flex:1}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.zoom{font-size:12px;color:var(--muted)}

/* ---------- Hoja del CV (lo que se imprime) ---------- */
.paper-scale{transform-origin:top center}
#cv{width:210mm;min-height:297mm;background:#fff;box-shadow:0 2px 14px rgba(16,24,40,.12);color:#111;
  padding:var(--m,16mm) var(--m,16mm);font-size:var(--fs,10.5pt);line-height:1.38}
#cv.letter{width:215.9mm;min-height:279.4mm}
#cv h1{margin:0;font-size:2.05em;line-height:1.1}
#cv .headline{font-size:1.08em;margin-top:2px}
#cv .contact{margin-top:5px;font-size:.93em}
#cv h2{font-size:1.02em;margin:1.1em 0 .45em;text-transform:uppercase;letter-spacing:.06em}
#cv h3{font-size:1em;margin:0}
#cv p{margin:.2em 0}
#cv ul{margin:.25em 0 .2em;padding-left:1.15em}
#cv li{margin:.12em 0}
#cv .entry{margin:0 0 .7em;break-inside:avoid}
#cv .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#cv .meta{white-space:nowrap;font-size:.95em}
#cv .sub{font-style:italic}
#cv .skills p{margin:.15em 0}
#cv .pagebreak-guide{display:none}
#cv a{color:inherit;text-decoration:none}
#cv ins{background:#c9f2d6;color:#0b5d2a;text-decoration:none;border-radius:2px;padding:0 1px}
#cv del{background:#fde2e2;color:#9b1c1c;border-radius:2px;padding:0 1px}
.pv-bar[hidden]{display:none!important}
.pv-bar{position:relative;z-index:5;max-width:210mm;background:#111827;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.pv-bar .btn{background:#fff;color:#111}
.pv-legend ins{background:#c9f2d6;color:#0b5d2a;text-decoration:none;padding:0 4px;border-radius:3px}
.pv-legend del{background:#fde2e2;color:#9b1c1c;padding:0 4px;border-radius:3px}
.editor.locked{opacity:.45;pointer-events:none}

/* Plantilla: Clásica */
#cv.t-clasica{font-family:Georgia,"Times New Roman",serif}
#cv.t-clasica header{text-align:center}
#cv.t-clasica h2{border-bottom:1px solid #222;padding-bottom:2px;color:#111}
/* Plantilla: Moderna */
#cv.t-moderna{font-family:Arial,Helvetica,sans-serif}
#cv.t-moderna h1{color:var(--accent)}
#cv.t-moderna header{border-bottom:2px solid var(--accent);padding-bottom:8px}
#cv.t-moderna h2{color:var(--accent);letter-spacing:.08em}
#cv.t-moderna h3{color:#111}
/* Plantilla: Ejecutiva */
#cv.t-ejecutiva{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif}
#cv.t-ejecutiva header{border-left:6px solid var(--accent);padding-left:12px}
#cv.t-ejecutiva h1{text-transform:uppercase;letter-spacing:.04em;font-size:1.9em}
#cv.t-ejecutiva .headline{color:var(--accent);font-weight:600}
#cv.t-ejecutiva h2{background:#f1f3f6;padding:3px 8px;color:var(--accent);border-left:3px solid var(--accent)}
/* Plantilla: Compacta */
#cv.t-compacta{font-family:Arial,Helvetica,sans-serif;line-height:1.28}
#cv.t-compacta h1{font-size:1.7em}
#cv.t-compacta header{text-align:left}
#cv.t-compacta h2{margin:.8em 0 .3em;font-size:.98em;border-bottom:1px solid #999}
#cv.t-compacta .entry{margin-bottom:.45em}
#cv.t-compacta li{margin:.05em 0}
/* Plantilla: Técnica */
#cv.t-tecnica{font-family:Cambria,Caladea,Georgia,serif}
#cv.t-tecnica h1{font-family:Calibri,Carlito,Arial,sans-serif;color:var(--accent)}
#cv.t-tecnica header{text-align:center}
#cv.t-tecnica h2{font-family:Calibri,Carlito,Arial,sans-serif;color:var(--accent);border-bottom:1.5px solid var(--accent);padding-bottom:1px}
#cv.t-tecnica .skills p b{color:var(--accent)}
/* Plantilla: Minimal */
#cv.t-minimal{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#cv.t-minimal h1{font-weight:300;font-size:2.2em;letter-spacing:.02em}
#cv.t-minimal h2{font-weight:700;font-size:.9em;letter-spacing:.18em;color:#555}
#cv.t-minimal h3{font-weight:600}

@media (max-width:1200px){.main{grid-template-columns:minmax(340px,420px) 1fr}.side{grid-column:1/-1;border-left:none;border-top:1px solid var(--line)}}
.mnav{display:none}
@media (max-width:820px){
  .main{grid-template-columns:1fr;padding-bottom:58px}.preview-wrap{padding:8px}
  .main[data-view="edit"] .preview-wrap,.main[data-view="edit"] .side{display:none}
  .main[data-view="cv"] .editor,.main[data-view="cv"] .side{display:none}
  .main[data-view="side"] .editor,.main[data-view="side"] .preview-wrap{display:none}
  .side{border-top:none}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:15}
  .mnav button{flex:1;border:none;background:none;padding:10px 4px;font-size:12px;color:var(--muted)}
  .mnav button.on{color:var(--brand);font-weight:700}
  header.top{gap:6px;padding:8px}header.top h1{width:100%}
  .toolbar label{font-size:11px}
}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app>header,.editor,.side,.toast,#cv .pg{display:none!important}
  .app,.main{display:block;height:auto}
  .pane{overflow:visible}
  .preview-wrap{padding:0;display:block}
  .paper-scale{transform:none!important;height:auto!important}
  #cv{box-shadow:none;width:auto;min-height:0}
}
</style>
<style id="pagesize">@media print{@page{size:A4;margin:0}}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>CV <span>ATS</span> Studio</h1>
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px">Editando
      <select id="cvSel" style="max-width:260px;font-weight:600"></select></label>
    <div class="toolbar">
      <label>Idioma del CV
        <select id="lang"><option value="es">Español</option><option value="en">English</option></select>
      </label>
      <label>Papel
        <select id="paper"><option value="a4">A4</option><option value="letter">Carta</option></select>
      </label>
      <label>Color <input type="color" id="accent" value="#1f4e79" style="width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px"></label>
      <label>Letra
        <select id="fs"><option value="9.5">9.5</option><option value="10">10</option><option value="10.5" selected>10.5</option><option value="11">11</option><option value="11.5">11.5</option></select>
      </label>
      <label>Márgenes
        <select id="margin"><option value="12">Estrechos</option><option value="16" selected>Normales</option><option value="20">Amplios</option></select>
      </label>
    </div>
    <div style="flex:1"></div>
    <div class="toolbar">
      <button class="btn" id="btnNew" title="Empezar un CV vacío">Nuevo</button>
      <button class="btn" id="btnImport" title="Importar tu CV (PDF, Word, foto, texto) o un .json guardado">Importar CV</button>
      <button class="btn" id="btnJson" title="Guardar tu CV para editarlo después">Guardar .json</button>
      <button class="btn" id="btnTxt" title="Texto plano: ideal para pegar en formularios de portales">.txt</button>
      <button class="btn" id="btnDoc" title="Documento de Word (.docx), el formato que mejor leen los ATS">Word .docx</button>
      <button class="btn primary" id="btnPdf" title="PDF con texto real, seleccionable (apto ATS)">Descargar PDF</button>
      <input type="file" id="fileIn" accept=".json,.pdf,.docx,.txt,image/*,application/pdf" hidden>
    </div>
  </header>

  <div class="main" data-view="edit">
    <section class="pane editor" id="editor"></section>

    <section class="pane preview-wrap" id="previewWrap" style="flex-direction:column;align-items:center;justify-content:flex-start">
      <div id="pvBar" class="pv-bar" hidden></div>
      <div class="paper-scale" id="paperScale">
        <article id="cv" class="t-moderna"></article>
      </div>
    </section>

    <aside class="pane side" id="side">
      <div class="tabs">
        <button class="tab active" data-tab="tpl">Plantillas</button>
        <button class="tab" data-tab="vac">Vacante</button>
        <button class="tab" data-tab="ats">Formato ATS</button>
        <button class="tab" data-tab="apps">Postulaciones</button>
        <button class="tab" data-tab="order">Orden</button>
      </div>
      <div id="tab-tpl"></div>
      <div id="tab-vac" hidden></div>
      <div id="tab-ats" hidden></div>
      <div id="tab-apps" hidden></div>
      <div id="tab-order" hidden></div>
    </aside>
  </div>
</div>
<nav class="mnav" id="mnav"><button data-v="edit" class="on">✏️<br>Editar</button><button data-v="cv">📄<br>Ver CV</button><button data-v="side">🎯<br>Vacante y ATS</button></nav>
<div id="limBar" hidden style="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:12;background:#fff7e6;border:1px solid #f5c26b;color:#7a4a00;border-radius:10px;padding:8px 12px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.12);gap:10px;align-items:center;max-width:94vw"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ Datos ============================ */
const LABELS = {
  es:{summary:"Perfil profesional",experience:"Experiencia profesional",education:"Educación",skills:"Habilidades",certifications:"Certificaciones",languages:"Idiomas",projects:"Proyectos",present:"Actualidad"},
  en:{summary:"Professional Summary",experience:"Professional Experience",education:"Education",skills:"Skills",certifications:"Certifications",languages:"Languages",projects:"Projects",present:"Present"}
};
const SECTION_NAMES = {summary:"Perfil profesional",experience:"Experiencia",education:"Educación",skills:"Habilidades",certifications:"Certificaciones",languages:"Idiomas",projects:"Proyectos"};

const TEMPLATES = [
  {id:"moderna",name:"Moderna",desc:"Sans-serif, color en títulos",mini:["#1f4e79",70,"#1f4e79",90,80,"#1f4e79",85]},
  {id:"clasica",name:"Clásica",desc:"Serif, centrada, sobria",mini:["#333",60,"#333",95,85,"#333",80]},
  {id:"ejecutiva",name:"Ejecutiva",desc:"Bandas de sección, gerencial",mini:["#1f4e79",75,"#dfe4ea",92,80,"#dfe4ea",88]},
  {id:"compacta",name:"Compacta",desc:"Densa: entra en 1 página",mini:["#444",55,"#999",98,96,"#999",97]},
  {id:"tecnica",name:"Técnica",desc:"Ingeniería, habilidades por grupo",mini:["#1f4e79",65,"#1f4e79",88,90,"#1f4e79",70]},
  {id:"minimal",name:"Minimal",desc:"Liviana, mucho aire",mini:["#888",50,"#bbb",80,70,"#bbb",75]}
];

function sample(){
  return {
    template:"moderna", lang:"es", paper:"a4", accent:"#1f4e79", fs:"10.5", margin:"16",
    order:["summary","experience","education","certifications","skills","languages","projects"],
    personal:{name:"Nombre Apellido",title:"Tu título profesional (ej.: Supervisor de Mantenimiento)",email:"correo@ejemplo.com",phone:"+54 9 000 000-0000",location:"Ciudad, País",linkedin:"linkedin.com/in/tu-perfil",web:""},
    summary:"Ejemplo: Técnico/a con experiencia en mantenimiento de equipos pesados. Coordino equipos de taller, planifico mantenimiento preventivo y correctivo y gestiono la relación con clientes. Enfocado/a en disponibilidad de flota, seguridad (HSE) y reducción de costos. Reemplazá este texto o importá tu CV arriba.",
    experience:[
      {role:"Puesto actual",company:"Empresa actual",location:"Ciudad, País",start:"MM/AAAA",end:"",bullets:"Logré un resultado medible con verbo de acción (ej.: reduje paradas no programadas en XX %).\nCoordiné un equipo de XX personas con cero incidentes.\nImplementé una mejora concreta y su impacto."},
      {role:"Puesto anterior",company:"Empresa anterior",location:"Ciudad, País",start:"MM/AAAA",end:"MM/AAAA",bullets:"Describí un logro medible con verbo de acción y resultado (%, $, tiempo).\nOtro logro relevante para el puesto al que te postulás."}
    ],
    education:[{degree:"Título obtenido",school:"Institución (completar)",location:"Ciudad, País",start:"",end:"AAAA",details:""}],
    certifications:[{name:"Ej.: Curso o certificación relevante",issuer:"Entidad",date:"AAAA"}],
    skills:[
      {group:"Técnicas",items:"Mantenimiento preventivo y correctivo, Hidráulica, Motores diésel, Análisis de fallas"},
      {group:"Gestión",items:"Liderazgo de equipos, Planificación, KPI, Control de costos, HSE"},
      {group:"Herramientas",items:"Excel avanzado, SAP"}
    ],
    languages:[{name:"Español",level:"Nativo"}],
    projects:[]
  };
}
function blank(){
  return {template:"moderna",lang:"es",paper:"a4",accent:"#1f4e79",fs:"10.5",margin:"16",
    order:["summary","experience","education","certifications","skills","languages","projects"],
    personal:{name:"",title:"",email:"",phone:"",location:"",linkedin:"",web:""},summary:"",
    experience:[{role:"",company:"",location:"",start:"",end:"",bullets:""}],
    education:[{degree:"",school:"",location:"",start:"",end:"",details:""}],
    certifications:[],skills:[{group:"",items:""}],languages:[],projects:[]};
}
const ITEM_TEMPLATES = {
  experience:()=>({role:"",company:"",location:"",start:"",end:"",bullets:""}),
  education:()=>({degree:"",school:"",location:"",start:"",end:"",details:""}),
  certifications:()=>({name:"",issuer:"",date:""}),
  skills:()=>({group:"",items:""}),
  languages:()=>({name:"",level:""}),
  projects:()=>({name:"",link:"",description:""})
};

/* ============================ Estado ============================ */
function normCV(d){
  const b=blank(), o=Object.assign({},b,d&&typeof d==="object"?d:{}); const str=v=>v==null?"":typeof v==="string"?v:Array.isArray(v)?v.join("\n"):String(v);
  o.personal=Object.assign({},b.personal); const p=(d&&d.personal)||{}; for(const k in b.personal)o.personal[k]=str(p[k]);
  o.summary=str(o.summary);
  const arr=(k,keys)=>{const a=Array.isArray(o[k])?o[k]:[];o[k]=a.filter(x=>x&&typeof x==="object").map(x=>{const y={};keys.forEach(kk=>y[kk]=str(x[kk]));return y})};
  arr("experience",["role","company","location","start","end","bullets"]);arr("education",["degree","school","location","start","end","details"]);
  arr("certifications",["name","issuer","date"]);arr("skills",["group","items"]);arr("languages",["name","level"]);arr("projects",["name","link","description"]);
  if(!Array.isArray(o.order)||!o.order.length)o.order=b.order.slice(); for(const k of Object.keys(SECTION_NAMES))if(!o.order.includes(k))o.order.push(k);
  ["template","lang","paper","accent","fs","margin"].forEach(k=>{if(typeof o[k]!=="string"||!o[k])o[k]=b[k]});
  if(!LABELS[o.lang])o.lang="es"; if(!TEMPLATES.some(t=>t.id===o.template))o.template="moderna";
  return o;
}
const KEY="cv-ats-studio-v1";
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || sample(); }catch(e){ S = sample(); }
S = normCV(S);
for(const k of Object.keys(SECTION_NAMES)) if(!S.order.includes(k)) S.order.push(k);
let jd = ""; try{ jd = localStorage.getItem(KEY+"-jd")||""; }catch(e){}
/* Postulaciones: cada vacante guarda su propio CV adaptado. El CV base no se toca. */
let APPS=[]; try{ APPS=JSON.parse(localStorage.getItem(KEY+"-apps"))||[]; }catch(e){ APPS=[]; }
APPS=(Array.isArray(APPS)?APPS:[]).filter(a=>a&&a.id).map(a=>Object.assign({puesto:"Vacante",empresa:"",fecha:"",estado:"Lista para enviar",jd:""},a,{puesto:String(a.puesto||"Vacante"),empresa:String(a.empresa||""),jd:String(a.jd||""),data:normCV(a.data),kw:(a.kw&&Array.isArray(a.kw.ignore)&&Array.isArray(a.kw.extra))?a.kw:{ignore:[],extra:[]}}));
let CUR="base"; try{ CUR=localStorage.getItem(KEY+"-cur")||"base"; }catch(e){}
let BASE=S;
let VKW={ignore:[],extra:[]}; try{VKW=JSON.parse(localStorage.getItem(KEY+"-kw"))||VKW}catch(e){}

/* ============================ Render del CV ============================ */
function wdiff(a,b){
  a=String(a||"");b=String(b||"");if(a===b)return esc(b);
  const A=a.split(/\s+/).filter(Boolean),B=b.split(/\s+/).filter(Boolean),n=A.length,m=B.length;
  if(n*m>250000)return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;const push=(t,w)=>{const l=out[out.length-1];if(l&&l.t===t)l.w.push(w);else out.push({t,w:[w]})};
  while(i<n&&j<m){if(A[i]===B[j]){push("=",A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){push("-",A[i]);i++}else{push("+",B[j]);j++}}
  while(i<n)push("-",A[i++]);while(j<m)push("+",B[j++]);
  return out.map(o=>{const t=esc(o.w.join(" "));return o.t==="="?t:o.t==="+"?`<ins>${t}</ins>`:`<del>${t}</del>`}).join(" ");
}
function cvHTML(st=S,base=null){
  const L=LABELS[st.lang], P=st.personal;
  const T=(path,val)=>base?wdiff(getPath(base,path)??"",val):esc(val);
  const contact=[P.location,P.phone,P.email,P.linkedin,P.web].filter(Boolean).map(esc).join(" &nbsp;|&nbsp; ");
  let h=`<header><h1>${esc(P.name)||"Tu Nombre"}</h1>${P.title||(base&&base.personal.title)?`<div class="headline">${T("personal.title",P.title)}</div>`:""}${contact?`<div class="contact">${contact}</div>`:""}</header>`;
  const S2={
    summary:()=>st.summary.trim()?`<section><h2>${L.summary}</h2><p>${T("summary",st.summary)}</p></section>`:"",
    experience:()=>{const it=st.experience.map((x,i)=>[x,i]).filter(([x])=>x.role||x.company);if(!it.length)return"";
      return `<section><h2>${L.experience}</h2>`+it.map(([x,i])=>{const b=lines(x.bullets);
        let lis;
        if(base){const ob=lines((base.experience[i]||{}).bullets);const k=Math.max(b.length,ob.length);lis=[];
          for(let j=0;j<k;j++){if(j<b.length&&j<ob.length)lis.push(`<li>${wdiff(ob[j],b[j])}</li>`);else if(j<b.length)lis.push(`<li><ins>${esc(b[j])}</ins></li>`);else lis.push(`<li><del>${esc(ob[j])}</del></li>`)}}
        else lis=b.map(l=>`<li>${esc(l)}</li>`);
        return `<div class="entry"><div class="row"><h3>${T(`experience.${i}.role`,x.role)}</h3><span class="meta">${esc(dateRange(x.start,x.end))}</span></div>
        <div class="row"><span class="sub">${esc(x.company)}</span><span class="meta">${esc(x.location)}</span></div>
        ${lis.length?`<ul>${lis.join("")}</ul>`:""}</div>`}).join("")+`</section>`},
    education:()=>{const it=st.education.filter(x=>x.degree||x.school);if(!it.length)return"";
      return `<section><h2>${L.education}</h2>`+it.map(x=>`<div class="entry"><div class="row"><h3>${esc(x.degree)}</h3><span class="meta">${esc(dateRange(x.start,x.end)||"")}</span></div>
        <div class="row"><span class="sub">${esc(x.school)}</span><span class="meta">${esc(x.location)}</span></div>${x.details?`<p>${esc(x.details)}</p>`:""}</div>`).join("")+`</section>`},
    certifications:()=>{const it=st.certifications.filter(x=>x.name);if(!it.length)return"";
      return `<section><h2>${L.certifications}</h2><ul>`+it.map(x=>`<li><b>${esc(x.name)}</b>${x.issuer?" — "+esc(x.issuer):""}${x.date?" ("+esc(x.date)+")":""}</li>`).join("")+`</ul></section>`},
    skills:()=>{const norm1=v=>v.split(/[,;\n]/).map(t=>t.trim()).filter(Boolean).join(", ");
      const ps=[], used=new Set();
      const pairs=st.skills.map((x,i)=>{let j=base?base.skills.findIndex((o,jj)=>!used.has(jj)&&norm(o.group)===norm(x.group)):-1;if(j<0&&base&&base.skills[i]&&!used.has(i)&&!st.skills.some(y=>norm(y.group)===norm(base.skills[i].group)))j=i;if(j>=0)used.add(j);return [x,j>=0?base.skills[j]:null]});
      if(base)base.skills.forEach((o,j)=>{if(!used.has(j))pairs.push([null,o])});
      for(const [x,o] of pairs){
        if(x&&x.items.trim()){const list=base?wdiff(o?norm1(o.items):"",norm1(x.items)):esc(norm1(x.items));
          const grp=x.group?(base?wdiff(o?o.group:"",x.group):esc(x.group)):"";ps.push(`<p>${grp?`<b>${grp}:</b> `:""}${list}</p>`)}
        else if(base&&o&&o.items.trim())ps.push(`<p><del>${o.group?esc(o.group)+": ":""}${esc(norm1(o.items))}</del></p>`)}
      return ps.length?`<section class="skills"><h2>${L.skills}</h2>${ps.join("")}</section>`:""},
    languages:()=>{const it=st.languages.filter(x=>x.name);if(!it.length)return"";
      return `<section><h2>${L.languages}</h2><p>`+it.map(x=>esc(x.name)+(x.level?" ("+esc(x.level)+")":"")).join(" · ")+`</p></section>`},
    projects:()=>{const it=st.projects.filter(x=>x.name);if(!it.length)return"";
      return `<section><h2>${L.projects}</h2>`+it.map(x=>`<div class="entry"><div class="row"><h3>${esc(x.name)}</h3><span class="meta">${esc(x.link)}</span></div>${x.description?`<p>${esc(x.description)}</p>`:""}</div>`).join("")+`</section>`}
  };
  for(const k of st.order) if(S2[k]) h+=S2[k]();
  return h;
}
function cvText(){
  const L=LABELS[S.lang],P=S.personal,out=[];
  out.push((P.name||"").toUpperCase()); if(P.title)out.push(P.title);
  out.push([P.location,P.phone,P.email,P.linkedin,P.web].filter(Boolean).join(" | "));
  const H=t=>{out.push("");out.push(t.toUpperCase())};
  for(const k of S.order){
    if(k==="summary"&&S.summary.trim()){H(L.summary);out.push(S.summary.trim())}
    if(k==="experience"){const it=S.experience.filter(x=>x.role||x.company);if(it.length){H(L.experience);it.forEach(x=>{out.push(`${x.role} — ${x.company}${x.location?", "+x.location:""} | ${dateRange(x.start,x.end)}`);lines(x.bullets).forEach(l=>out.push("- "+l));out.push("")})}}
    if(k==="education"){const it=S.education.filter(x=>x.degree||x.school);if(it.length){H(L.education);it.forEach(x=>{out.push(`${x.degree} — ${x.school}${x.location?", "+x.location:""}${dateRange(x.start,x.end)?" | "+dateRange(x.start,x.end):""}`);if(x.details)out.push(x.details)})}}
    if(k==="certifications"){const it=S.certifications.filter(x=>x.name);if(it.length){H(L.certifications);it.forEach(x=>out.push("- "+x.name+(x.issuer?" — "+x.issuer:"")+(x.date?" ("+x.date+")":"")))}}
    if(k==="skills"){const it=S.skills.filter(x=>x.items.trim());if(it.length){H(L.skills);it.forEach(x=>out.push((x.group?x.group+": ":"")+x.items.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean).join(", ")))}}
    if(k==="languages"){const it=S.languages.filter(x=>x.name);if(it.length){H(L.languages);out.push(it.map(x=>x.name+(x.level?" ("+x.level+")":"")).join(", "))}}
    if(k==="projects"){const it=S.projects.filter(x=>x.name);if(it.length){H(L.projects);it.forEach(x=>{out.push(x.name+(x.link?" — "+x.link:""));if(x.description)out.push(x.description)})}}
  }
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim()+"\n";
}

function fit(){
  const wrap=$("#previewWrap"),cv=$("#cv"),sc=$("#paperScale");
  if(wrap.clientWidth<60)return;
  const avail=wrap.clientWidth-40, w=cv.offsetWidth;
  const k=Math.min(1,avail/w);
  sc.style.transform=`scale(${k})`;
  sc.style.height=(cv.offsetHeight*k)+"px";
}

function renderPageGuides(){
  const cv=$("#cv");
  cv.querySelectorAll(".pg").forEach(n=>n.remove());
  const pageH=(S.paper==="letter"?279.4:297)*96/25.4;
  const n=Math.max(1,Math.ceil((cv.scrollHeight-4)/pageH));
  cv.style.position="relative";
  for(let i=1;i<n;i++){const d=document.createElement("div");d.className="pg";
    d.style.cssText=`position:absolute;left:0;right:0;top:${i*pageH}px;border-top:1px dashed #e11d48;pointer-events:none`;
    d.innerHTML=`<span style="position:absolute;right:6px;top:-16px;font:11px system-ui;color:#e11d48">fin página ${i}</span>`;cv.appendChild(d)}
  pages=n;
}

async function pdfCVText(f){

let dlNS=null;
try{ if(window.claude&&window.claude.use) window.claude.use("downloads").then(n=>{dlNS=n}).catch(()=>{}); }catch(e){}
async function saveFile(filename,data,mime){
  if(!dlNS&&window.claude&&window.claude.use){try{dlNS=await Promise.race([window.claude.use("downloads"),new Promise(r=>setTimeout(()=>r(null),4000))])}catch(e){}}
  if(dlNS){
    try{ await dlNS.save({filename,data}); toast("Listo: "+filename); return true; }
    catch(e){ const c=e&&e.code; if(c==="declined")toast("Descarga cancelada");else if(c==="rate_limited")toast("Esperá un momento y probá de nuevo");else showDlHelp(); return false; }
  }
  const b=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
  try{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);}catch(e){}
  if(window.claude){ showDlHelp(filename); return false; }
  toast("Descargado: "+filename); return true;
}

const libCache={};
function loadLib(url,globalName){
  if(window[globalName]) return Promise.resolve(window[globalName]);
  if(!libCache[url]) libCache[url]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=url;s.onload=()=>window[globalName]?res(window[globalName]):rej(new Error("lib"));s.onerror=()=>{delete libCache[url];rej(new Error("No se pudo cargar "+url))};document.head.appendChild(s)});
  return libCache[url];
}
const JSPDF_URL="lib/jspdf.umd.min.js";
const DOCX_URL="lib/docx.iife.js";

/* Modelo estructurado común a PDF y Word */
function cvModel(){
  const L=LABELS[S.lang],P=S.personal,secs=[];
  for(const k of S.order){
    if(k==="summary"&&S.summary.trim()) secs.push({title:L.summary,blocks:[{type:"p",text:S.summary.trim()}]});
    if(k==="experience"){const it=S.experience.filter(x=>x.role||x.company);if(it.length)secs.push({title:L.experience,blocks:it.map(x=>({type:"entry",title:x.role,right:dateRange(x.start,x.end),sub:x.company,subRight:x.location,bullets:lines(x.bullets)}))})}
    if(k==="education"){const it=S.education.filter(x=>x.degree||x.school);if(it.length)secs.push({title:L.education,blocks:it.map(x=>({type:"entry",title:x.degree,right:dateRange(x.start,x.end),sub:x.school,subRight:x.location,bullets:[],note:x.details}))})}
    if(k==="certifications"){const it=S.certifications.filter(x=>x.name);if(it.length)secs.push({title:L.certifications,blocks:[{type:"bullets",items:it.map(x=>({bold:x.name,text:(x.issuer?" — "+x.issuer:"")+(x.date?" ("+x.date+")":"")}))}]})}
    if(k==="skills"){const it=S.skills.filter(x=>x.items.trim());if(it.length)secs.push({title:L.skills,blocks:it.map(x=>({type:"rich",bold:x.group?x.group+": ":"",text:x.items.split(/[,;\n]/).map(s=>s.trim()).filter(Boolean).join(", ")}))})}
    if(k==="languages"){const it=S.languages.filter(x=>x.name);if(it.length)secs.push({title:L.languages,blocks:[{type:"p",text:it.map(x=>x.name+(x.level?" ("+x.level+")":"")).join(" · ")}]})}
    if(k==="projects"){const it=S.projects.filter(x=>x.name);if(it.length)secs.push({title:L.projects,blocks:it.map(x=>({type:"entry",title:x.name,right:x.link,sub:"",subRight:"",bullets:[],note:x.description}))})}
  }
  return {name:P.name||"",title:P.title||"",contact:[P.location,P.phone,P.email,P.linkedin,P.web].filter(Boolean),secs};
}
const LOOK={
  moderna:{serif:false,center:false,headColor:"accent",rule:"none",headerRule:true,nameColor:"accent",upper:true},
  clasica:{serif:true,center:true,headColor:"black",rule:"below",nameColor:"black",upper:true},
  ejecutiva:{serif:false,center:false,headColor:"accent",rule:"band",nameColor:"black",upper:true,nameUpper:true,leftBar:true},
  compacta:{serif:false,center:false,headColor:"black",rule:"below",nameColor:"black",upper:true,compact:true},
  tecnica:{serif:true,center:true,headColor:"accent",rule:"below",nameColor:"accent",upper:true},
  minimal:{serif:false,center:false,headColor:"gray",rule:"none",nameColor:"black",upper:true,spaced:true}
};
function hexRGB(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}

async function exportPDF(){
  toast("Generando PDF…");
  let J; try{ J=await loadLib(JSPDF_URL,"jspdf"); }catch(e){ toast("No se pudo cargar el generador de PDF (revisá la conexión)"); return; }
  const M=cvModel(), lk=LOOK[S.template]||LOOK.moderna, acc=hexRGB(S.accent);
  const doc=new J.jsPDF({unit:"pt",format:S.paper==="letter"?"letter":"a4"});
  doc.setProperties({title:(M.name?M.name+" – ":"")+"CV",subject:M.title,author:M.name,keywords:S.skills.map(s=>s.items).join(", "),creator:"CV ATS Studio"});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  const m=(+S.margin)*72/25.4, fs=+S.fs, lh=fs*(lk.compact?1.28:1.38), cw=W-2*m;
  const F=lk.serif?"times":"helvetica";
  let y=m;
  const color=c=>c==="accent"?doc.setTextColor(...acc):c==="gray"?doc.setTextColor(85,85,85):doc.setTextColor(17,17,17);
  const font=(st,size)=>{doc.setFont(F,st);doc.setFontSize(size||fs)};
  const ensure=h=>{if(y+h>H-m){doc.addPage();y=m}};
  const wrap=(t,w)=>doc.splitTextToSize(String(t),w);
  function para(text,{style="normal",size=fs,indent=0,width=cw-indent,align}={}){font(style,size);const ls=wrap(text,width);const l=size*(lh/fs);
    ls.forEach(s=>{ensure(l);doc.text(s,align==="center"?W/2:m+indent,y+size*0.8,align==="center"?{align:"center"}:undefined);y+=l})}
  function rich(bold,text,{indent=0,width=cw-indent}={}){
    const l=lh; font("bold"); let bw=bold?doc.getTextWidth(bold.trimEnd()):0; font("normal"); if(bold)bw+=doc.getTextWidth(" ")*1.2;
    const words=String(text).split(/\s+/).filter(Boolean); const out=[]; let cur="", avail=width-bw;
    for(const w of words){const t=cur?cur+" "+w:w; if(doc.getTextWidth(t)>avail&&cur){out.push(cur);cur=w;avail=width}else cur=t}
    if(cur)out.push(cur);
    out.forEach((s,i)=>{ensure(l);if(i===0&&bold){font("bold");color("black");doc.text(bold.trimEnd(),m+indent,y+fs*0.8);font("normal");doc.text(s,m+indent+bw,y+fs*0.8)}else{font("normal");doc.text(s,m+indent,y+fs*0.8)}y+=l});
    if(!out.length&&bold){ensure(l);font("bold");doc.text(bold,m+indent,y+fs*0.8);y+=l}
  }
  function row(left,right,style){
    font("normal"); const rw=right?doc.getTextWidth(right)+8:0; font(style);
    const ls=wrap(left||"",cw-rw); ensure(lh);
    ls.forEach((s,i)=>{ensure(lh);font(style);doc.text(s,m,y+fs*0.8);if(i===0&&right){font("normal");doc.text(right,W-m,y+fs*0.8,{align:"right"})}y+=lh});
  }
  // Encabezado
  const nameSize=fs*(lk.compact?1.7:2.05); color(lk.nameColor); font("bold",nameSize);
  const nm=lk.nameUpper?M.name.toUpperCase():M.name;
  if(lk.leftBar){doc.setFillColor(...acc);}
  const headTop=y;
  {const nl=wrap(nm,cw-(lk.leftBar?12:0));nl.forEach((t,i)=>{if(lk.center)doc.text(t,W/2,y+nameSize*0.8,{align:"center"});else doc.text(t,m+(lk.leftBar?12:0),y+nameSize*0.8);y+=nameSize*1.15})}
  if(M.title){color(lk.rule==="band"?"accent":"black");font(lk.rule==="band"?"bold":"normal",fs*1.08);
    const tl=wrap(M.title,cw-(lk.leftBar?12:0));tl.forEach((t,i)=>{if(lk.center)doc.text(t,W/2,y+fs*0.85,{align:"center"});else doc.text(t,m+(lk.leftBar?12:0),y+fs*0.85);y+=fs*(i<tl.length-1?1.25:1.4)})}
  if(M.contact.length){color("black");font("normal",fs*0.93);const c=M.contact.join("  |  ");const ls=wrap(c,cw-(lk.leftBar?12:0));
    ls.forEach(s=>{if(lk.center)doc.text(s,W/2,y+fs*0.8,{align:"center"});else doc.text(s,m+(lk.leftBar?12:0),y+fs*0.8);y+=fs*1.25})}
  if(lk.leftBar){doc.rect(m,headTop,4.5,y-headTop,"F")}
  if(lk.headerRule){y+=3;doc.setDrawColor(...acc);doc.setLineWidth(1.5);doc.line(m,y,W-m,y);y+=2}
  // Secciones
  for(const sec of M.secs){
    const gap=fs*(lk.compact?0.8:1.1); y+=gap; ensure(lh*3);
    const t=lk.upper?sec.title.toUpperCase():sec.title; const hs=fs*1.02;
    color(lk.headColor); font("bold",lk.spaced?fs*0.9:hs);
    const cs=lk.spaced?1.6:0.6;
    if(lk.rule==="band"){doc.setFillColor(241,243,246);doc.rect(m,y-2,cw,hs*1.45,"F");doc.setFillColor(...acc);doc.rect(m,y-2,2.5,hs*1.45,"F");doc.text(t,m+8,y+hs*0.85,{charSpace:cs});y+=hs*1.45+3}
    else{doc.text(t,m,y+hs*0.8,{charSpace:cs});y+=hs*1.15;
      if(lk.rule==="below"){doc.setDrawColor(...(lk.headColor==="accent"?acc:[40,40,40]));doc.setLineWidth(lk.headColor==="accent"?1.1:0.7);doc.line(m,y,W-m,y);y+=4}else y+=2}
    color("black");
    for(const b of sec.blocks){
      if(b.type==="p") para(b.text);
      else if(b.type==="rich") rich(b.bold,b.text);
      else if(b.type==="bullets"){for(const it of b.items){ensure(lh);font("normal");doc.text("•",m+3,y+fs*0.8);rich(it.bold,it.text,{indent:13})}}
      else if(b.type==="entry"){
        ensure(lh*3);
        row(b.title,b.right,"bold");
        if(b.sub||b.subRight)row(b.sub,b.subRight,"italic");
        if(b.note)para(b.note);
        for(const bl of b.bullets){ensure(lh);font("normal");doc.text("•",m+3,y+fs*0.8);para(bl,{indent:13})}
        y+=fs*(lk.compact?0.35:0.55);
      }
    }
  }
  const blob=doc.output("blob");
  await saveFile(fileBase()+".pdf",blob,"application/pdf");
}

async function exportDOCX(){
  toast("Generando Word…");
  let D; try{ D=await loadLib(DOCX_URL,"docx"); }catch(e){ toast("No se pudo cargar el generador de Word (revisá la conexión)"); return; }
  const {Document,Packer,Paragraph,TextRun,AlignmentType,TabStopType,BorderStyle,ShadingType,LevelFormat}=D;
  const M=cvModel(), lk=LOOK[S.template]||LOOK.moderna, acc=S.accent.replace("#","").toUpperCase();
  const fontName={moderna:"Arial",clasica:"Georgia",ejecutiva:"Calibri",compacta:"Arial",tecnica:"Cambria",minimal:"Arial"}[S.template]||"Arial";
  const hp=pt=>Math.round(pt*2);
  const pageW=S.paper==="letter"?12240:11906, pageH=S.paper==="letter"?15840:16838, mg=Math.round(+S.margin*56.7);
  const contentW=pageW-2*mg, fs=+S.fs, after=lk.compact?20:40;
  const colorOf=c=>c==="accent"?acc:c==="gray"?"555555":"111111";
  const kids=[];
  const al=lk.center?AlignmentType.CENTER:AlignmentType.LEFT;
  const barBorder=lk.leftBar?{left:{style:BorderStyle.SINGLE,size:36,color:acc,space:8}}:undefined;
  kids.push(new Paragraph({alignment:al,border:barBorder,spacing:{after:20},children:[new TextRun({text:lk.nameUpper?M.name.toUpperCase():M.name,bold:true,size:hp(fs*(lk.compact?1.7:2.05)),color:colorOf(lk.nameColor)})]}));
  if(M.title)kids.push(new Paragraph({alignment:al,border:barBorder,spacing:{after:20},children:[new TextRun({text:M.title,size:hp(fs*1.08),bold:lk.rule==="band",color:lk.rule==="band"?acc:"111111"})]}));
  if(M.contact.length)kids.push(new Paragraph({alignment:al,border:Object.assign({},barBorder||{},lk.headerRule?{bottom:{style:BorderStyle.SINGLE,size:12,color:acc,space:6}}:{}),spacing:{after:60},children:[new TextRun({text:M.contact.join("  |  "),size:hp(fs*0.93)})]}));
  const tabs=[{type:TabStopType.RIGHT,position:contentW}];
  for(const sec of M.secs){
    const t=lk.upper?sec.title.toUpperCase():sec.title;
    const opts={spacing:{before:lk.compact?160:220,after:80},keepNext:true,children:[new TextRun({text:t,bold:true,size:hp(lk.spaced?fs*0.9:fs*1.02),color:colorOf(lk.headColor),characterSpacing:lk.spaced?30:10})]};
    if(lk.rule==="below")opts.border={bottom:{style:BorderStyle.SINGLE,size:lk.headColor==="accent"?10:6,color:lk.headColor==="accent"?acc:"333333",space:2}};
    if(lk.rule==="band"){opts.shading={type:ShadingType.CLEAR,fill:"F1F3F6",color:"auto"};opts.border={left:{style:BorderStyle.SINGLE,size:18,color:acc,space:4}}}
    kids.push(new Paragraph(opts));
    for(const b of sec.blocks){
      if(b.type==="p")kids.push(new Paragraph({spacing:{after},children:[new TextRun(b.text)]}));
      else if(b.type==="rich")kids.push(new Paragraph({spacing:{after:20},children:[new TextRun({text:b.bold,bold:true}),new TextRun(b.text)]}));
      else if(b.type==="bullets")b.items.forEach(it=>kids.push(new Paragraph({numbering:{reference:"bul",level:0},spacing:{after:20},children:[new TextRun({text:it.bold,bold:true}),new TextRun(it.text)]})));
      else if(b.type==="entry"){
        kids.push(new Paragraph({tabStops:tabs,keepNext:true,spacing:{after:0},children:[new TextRun({text:b.title,bold:true}),...(b.right?[new TextRun("\t"+b.right)]:[])]}));
        if(b.sub||b.subRight)kids.push(new Paragraph({tabStops:tabs,keepNext:true,spacing:{after:20},children:[new TextRun({text:b.sub,italics:true}),...(b.subRight?[new TextRun("\t"+b.subRight)]:[])]}));
        if(b.note)kids.push(new Paragraph({spacing:{after:20},children:[new TextRun(b.note)]}));
        b.bullets.forEach(x=>kids.push(new Paragraph({numbering:{reference:"bul",level:0},spacing:{after:10},children:[new TextRun(x)]})));
        kids.push(new Paragraph({spacing:{after:lk.compact?40:80},children:[]}));
      }
    }
  }
  const d=new Document({
    creator:M.name||"CV ATS Studio",title:(M.name?M.name+" – ":"")+"CV",
    styles:{default:{document:{run:{font:fontName,size:hp(fs),color:"111111"},paragraph:{spacing:{line:lk.compact?250:270}}}}},
    numbering:{config:[{reference:"bul",levels:[{level:0,format:LevelFormat.BULLET,text:"•",alignment:AlignmentType.LEFT,style:{paragraph:{indent:{left:300,hanging:220}}}}]}]},
    sections:[{properties:{page:{size:{width:pageW,height:pageH},margin:{top:mg,bottom:mg,left:mg,right:mg}}},children:kids}]
  });
  const blob=await Packer.toBlob(d);
  await saveFile(fileBase()+".docx",blob,"application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}
